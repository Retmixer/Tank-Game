<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка аудио</title><h1>Декодирование локальных звуков</h1><pre id="result">Проверка…</pre><script>
(async()=>{const context=new AudioContext(),rows=[];try{for(const name of ['engine','wind','shot','hit','boom']){const response=await fetch('../assets/audio/'+name+'.ogg');if(!response.ok)throw Error(name+': HTTP '+response.status);const buffer=await context.decodeAudioData(await response.arrayBuffer());if(!buffer.duration)throw Error(name+': empty audio');rows.push(name+': '+buffer.duration.toFixed(2)+' с, '+buffer.sampleRate+' Гц');}document.getElementById('result').textContent='PASS\n'+rows.join('\n');}catch(error){document.getElementById('result').textContent='FAIL '+error.message;}finally{await context.close();}})();
</script></html>
